<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Glyph Studio -- letterform &amp; syllable-block authoring</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f2; color: #222; }
    header { padding: 10px 16px; background: #222; color: #eee; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header p { margin: 0; font-size: 12px; color: #aaa; }
    nav.tabs { display: flex; gap: 4px; padding: 8px 16px 0; }
    nav.tabs button { padding: 8px 16px; border: 1px solid #ccc; border-bottom: none; background: #e8e8e5; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 13px; }
    nav.tabs button.active { background: #fff; font-weight: 600; }
    .panel { display: none; background: #fff; padding: 16px; border-top: 1px solid #ccc; }
    .panel.active { display: flex; gap: 16px; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .col-letters { width: 220px; overflow-y: auto; max-height: 80vh; }
    .col-canvas { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .col-meta { width: 300px; font-size: 13px; }
    canvas.grid-canvas { width: 560px; height: 560px; border: 1px solid #999; touch-action: none; cursor: crosshair; }
    .letter-btn { display: block; width: 100%; text-align: left; padding: 4px 8px; margin: 1px 0; border: 1px solid transparent; background: none; cursor: pointer; font-size: 12px; border-radius: 4px; }
    .letter-btn:hover { background: #eee; }
    .letter-btn.active { background: #dbe9ff; border-color: #8ab4f8; }
    .letter-btn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.filled { background: #2a7a3a; }
    .dot.empty { background: #ccc; }
    .letter-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin: 10px 0 2px; }
    .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .toolbar button, .toolbar select, .toolbar label { font-size: 12px; }
    button { cursor: pointer; }
    .meta-box { background: #f8f8f6; border: 1px solid #e0e0dc; border-radius: 6px; padding: 10px; }
    .meta-box h3 { margin: 0 0 6px; font-size: 13px; }
    .meta-box p { margin: 4px 0; font-size: 12px; line-height: 1.4; }
    label.check-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0; }
    .palette { display: flex; flex-wrap: wrap; gap: 4px; width: 220px; max-height: 200px; overflow-y: auto; }
    .palette button { padding: 4px 8px; font-size: 12px; }
    .draft-row { display: flex; gap: 4px; align-items: center; font-size: 12px; }
    .export-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 12px; }
    .export-row .tok { width: 110px; font-weight: 600; }
    #status { font-size: 11px; color: #666; min-height: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Glyph Studio</h1>
    <p>Letterform &amp; syllable-block authoring for the script -- 01-alphabet/00-laws.md's own grid and generator law, drawn.</p>
  </header>

  <nav class="tabs">
    <button data-tab="studio" class="active">Letter Studio</button>
    <button data-tab="compose">Compose Sandbox</button>
    <button data-tab="export">Export</button>
  </nav>

  <section class="panel active" id="panel-studio">
    <div class="col col-letters" id="letter-list"></div>
    <div class="col col-canvas">
      <div class="toolbar">
        <button id="mode-vector" class="active">vector pen</button>
        <button id="mode-pixel">pixel paint</button>
        <span> | </span>
        <button id="undo">undo</button>
        <button id="clear">clear</button>
        <span> | </span>
        <label>pixel size <select id="pixel-size"></select></label>
        <button id="derive-pixels">derive pixels from vector</button>
      </div>
      <canvas class="grid-canvas" id="canvas" width="1200" height="1200"></canvas>
      <div id="status"></div>
    </div>
    <div class="col col-meta" id="meta-panel"></div>
  </section>

  <section class="panel" id="panel-compose">
    <div class="col col-letters">
      <div class="letter-group-label">palette (drawn letters)</div>
      <div class="palette" id="compose-palette"></div>
      <div class="letter-group-label">selected placement</div>
      <div id="compose-selected" class="meta-box"><p>Click a letter above to add it, then click a placed letter on the canvas to select it.</p></div>
      <div class="letter-group-label">drafts</div>
      <div class="toolbar">
        <input type="text" id="draft-name" placeholder="draft name" style="width:110px;" />
        <button id="draft-save">save</button>
      </div>
      <div id="draft-list"></div>
    </div>
    <div class="col col-canvas">
      <canvas class="grid-canvas" id="compose-canvas" width="1200" height="1200"></canvas>
      <div id="compose-status" class="toolbar"></div>
    </div>
  </section>

  <section class="panel" id="panel-export">
    <div class="col" style="width:100%;">
      <div class="toolbar">
        <button id="export-all">download everything (JSON backup)</button>
        <label style="cursor:pointer;">import backup <input type="file" id="import-all" accept="application/json" style="display:none;" /></label>
      </div>
      <div id="export-list"></div>
    </div>
  </section>

  <script type="module" src="src/app.js"></script>
</body>
</html>
